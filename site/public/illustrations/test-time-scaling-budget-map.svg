<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">测试时计算的深度、宽度、验证与搜索预算图</title>
  <desc id="desc">同一份推理预算可以用于延长一条轨迹、并行生成多条轨迹、调用验证器，或在树中展开和剪枝。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf4"/><stop offset="1" stop-color="#f4f7ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#25324a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#63708a"/></marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#15233f}.sub{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.head{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1e2c47}.body{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#40506b}.tiny{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.pill{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.eq{font:600 18px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#25324a}
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="54" y="58" class="title">一份测试时预算，可以花在四个位置</text>
  <text x="54" y="88" class="sub">先问“钱花在哪里”，再问“它是否带来新信息”。</text>

  <g filter="url(#shadow)">
    <rect x="54" y="130" width="230" height="370" rx="22" fill="#fff" stroke="#d8dfeb"/>
    <rect x="75" y="151" width="88" height="30" rx="15" fill="#5268d8"/><text x="119" y="172" text-anchor="middle" class="pill">深度</text>
    <text x="76" y="220" class="head">延长一条轨迹</text>
    <path d="M104 258V406" stroke="#5268d8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <circle cx="104" cy="269" r="11" fill="#e7ebff" stroke="#5268d8"/><circle cx="104" cy="315" r="11" fill="#e7ebff" stroke="#5268d8"/><circle cx="104" cy="361" r="11" fill="#e7ebff" stroke="#5268d8"/>
    <text x="137" y="274" class="body">列子目标</text><text x="137" y="320" class="body">计算与检查</text><text x="137" y="366" class="body">反思、修正</text>
    <text x="76" y="456" class="tiny">代价：串行延迟增加</text>
    <text x="76" y="481" class="tiny">风险：循环、过度思考</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="310" y="130" width="230" height="370" rx="22" fill="#fff" stroke="#d8dfeb"/>
    <rect x="331" y="151" width="88" height="30" rx="15" fill="#e27b43"/><text x="375" y="172" text-anchor="middle" class="pill">宽度</text>
    <text x="332" y="220" class="head">并行采样 N 条</text>
    <path d="M370 260L370 294M370 294L342 326M370 294L399 326M370 294L456 326" fill="none" stroke="#e27b43" stroke-width="4" stroke-linecap="round"/>
    <rect x="326" y="326" width="88" height="54" rx="12" fill="#fff1e9" stroke="#e27b43"/><rect x="422" y="326" width="88" height="54" rx="12" fill="#fff1e9" stroke="#e27b43"/>
    <text x="370" y="359" text-anchor="middle" class="body">路径 1</text><text x="466" y="359" text-anchor="middle" class="body">路径 N</text>
    <text x="332" y="421" class="tiny">收益：扩大正确解覆盖率</text>
    <text x="332" y="456" class="tiny">代价：总 token 约乘 N</text>
    <text x="332" y="481" class="tiny">风险：候选高度相关</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="566" y="130" width="230" height="370" rx="22" fill="#fff" stroke="#d8dfeb"/>
    <rect x="587" y="151" width="88" height="30" rx="15" fill="#2c9d83"/><text x="631" y="172" text-anchor="middle" class="pill">验证</text>
    <text x="588" y="220" class="head">判断哪条更可信</text>
    <rect x="594" y="257" width="174" height="48" rx="12" fill="#e8f7f2" stroke="#2c9d83"/><text x="681" y="287" text-anchor="middle" class="body">规则 / 单元测试</text>
    <rect x="594" y="319" width="174" height="48" rx="12" fill="#e8f7f2" stroke="#2c9d83"/><text x="681" y="349" text-anchor="middle" class="body">ORM / PRM</text>
    <rect x="594" y="381" width="174" height="48" rx="12" fill="#e8f7f2" stroke="#2c9d83"/><text x="681" y="411" text-anchor="middle" class="body">检索 / 工具反馈</text>
    <text x="588" y="456" class="tiny">收益：把覆盖变成命中</text>
    <text x="588" y="481" class="tiny">风险：代理分数被利用</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="822" y="130" width="324" height="370" rx="22" fill="#fff" stroke="#d8dfeb"/>
    <rect x="843" y="151" width="88" height="30" rx="15" fill="#8c5cc7"/><text x="887" y="172" text-anchor="middle" class="pill">搜索</text>
    <text x="844" y="220" class="head">展开、评分、剪枝、回溯</text>
    <circle cx="984" cy="264" r="18" fill="#f1eafa" stroke="#8c5cc7" stroke-width="2"/>
    <path d="M984 282L914 326M984 282L1054 326M914 344L874 392M914 344L947 392M1054 344L1021 392M1054 344L1094 392" stroke="#8c5cc7" stroke-width="3" fill="none"/>
    <g fill="#f1eafa" stroke="#8c5cc7" stroke-width="2"><circle cx="914" cy="335" r="16"/><circle cx="1054" cy="335" r="16"/><circle cx="874" cy="402" r="14"/><circle cx="947" cy="402" r="14"/><circle cx="1021" cy="402" r="14"/><circle cx="1094" cy="402" r="14"/></g>
    <path d="M1044 335L1064 335M1054 325L1054 345" stroke="#fff" stroke-width="3"/>
    <path d="M938 393L956 411M956 393L938 411" stroke="#c64d56" stroke-width="4"/>
    <text x="844" y="456" class="tiny">收益：在中间步骤提前纠偏</text>
    <text x="844" y="481" class="tiny">风险：分支爆炸、过度优化</text>
  </g>

  <rect x="54" y="530" width="1092" height="56" rx="18" fill="#eef2f8"/>
  <text x="82" y="565" class="eq">总预算 B = 生成 token + λᵥ × 验证 token + λₜ × 工具调用</text>
</svg>
