<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">DPO 从 KL 正则奖励目标变换为偏好分类目标</title><desc id="desc">最优策略等于参考策略乘奖励指数并归一化；用策略与参考策略的 log 比表示奖励差，配分函数在成对差中消去。</desc>
  <rect width="1200" height="560" rx="30" fill="#f8faff"/>
  <text x="60" y="68" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#182342">DPO 的关键不是“去掉奖励”，而是把奖励改写成策略相对参考的 log-ratio</text>
  <text x="60" y="102" font-family="system-ui,sans-serif" font-size="17" fill="#5c6787">成对比较只依赖奖励差，所以与 prompt 有关的配分函数会相消</text>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(70 165)"><rect width="300" height="260" rx="22" fill="#eef1ff" stroke="#8799e9" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#5368d9"/><text x="42" y="49" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text><text x="80" y="49" font-size="19" font-weight="700" fill="#25345d">KL 正则奖励目标</text><text x="150" y="105" text-anchor="middle" font-size="17" fill="#34467e">max E[r(x,y)]</text><text x="150" y="136" text-anchor="middle" font-size="17" fill="#34467e">− β KL(π || πref)</text><text x="28" y="188" font-size="14" fill="#596683">高奖励回答概率上升</text><text x="28" y="215" font-size="14" fill="#596683">但不能任意偏离 reference</text></g>
    <g transform="translate(450 165)"><rect width="300" height="260" rx="22" fill="#eaf8f4" stroke="#72baa7" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#28987d"/><text x="42" y="49" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text><text x="80" y="49" font-size="19" font-weight="700" fill="#205c50">最优策略闭式关系</text><text x="150" y="105" text-anchor="middle" font-size="17" fill="#205c50">π*(y|x) ∝ πref(y|x)</text><text x="150" y="136" text-anchor="middle" font-size="17" fill="#205c50">× exp(r(x,y)/β)</text><text x="28" y="188" font-size="14" fill="#4c6f67">反解：r = β log(π*/πref)</text><text x="28" y="215" font-size="14" fill="#4c6f67">+ β log Z(x)</text></g>
    <g transform="translate(830 165)"><rect width="300" height="260" rx="22" fill="#fff4e5" stroke="#dfa84e" stroke-width="2"/><circle cx="42" cy="42" r="22" fill="#cf8b2d"/><text x="42" y="49" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text><text x="80" y="49" font-size="19" font-weight="700" fill="#684c1e">代入偏好概率</text><text x="150" y="105" text-anchor="middle" font-size="16" fill="#684c1e">σ(rwinner − rloser)</text><text x="150" y="136" text-anchor="middle" font-size="16" fill="#684c1e">Z(x) − Z(x) = 0</text><text x="28" y="188" font-size="14" fill="#745f43">直接训练 policy/ref 的</text><text x="28" y="215" font-size="14" fill="#745f43">赢家—输家相对 margin</text></g>
  </g>
  <path d="M370 295h62M750 295h62" stroke="#5368d9" stroke-width="4"/><path d="M418 284l14 11-14 11M798 284l14 11-14 11" fill="none" stroke="#5368d9" stroke-width="4"/>
  <rect x="150" y="462" width="900" height="55" rx="16" fill="#fff0ef"/><text x="600" y="496" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#6d3b37">成立依赖：固定偏好数据、Bradley–Terry 类模型、reference 与数据分布关系；不等于任意在线 RL 都可被分类替代。</text>
</svg>
