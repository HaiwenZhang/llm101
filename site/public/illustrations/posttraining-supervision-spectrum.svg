<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">后训练监督信号从目标 token 到环境轨迹的光谱</title><desc id="desc">SFT 提供完整目标 token，偏好提供成对排序，验证器提供结果奖励，Agent 环境提供多步状态转移；越往右探索更强但反馈和系统更复杂。</desc><rect width="1200" height="560" rx="30" fill="#f8faff"/><text x="60" y="68" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#182342">后训练方法的根本差异：谁提供目标，反馈落在哪个粒度</text><text x="60" y="102" font-family="system-ui,sans-serif" font-size="17" fill="#5c6787">越往右越能学习数据外轨迹，但采样、信用分配、验证与安全成本也越高</text>
<g font-family="system-ui,sans-serif"><g transform="translate(60 165)"><rect width="250" height="280" rx="22" fill="#eef1ff" stroke="#8799e9" stroke-width="2"/><text x="125" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#25345d">SFT</text><text x="125" y="84" text-anchor="middle" font-size="15" fill="#596683">目标：每个 teacher token</text><text x="125" y="120" text-anchor="middle" font-size="15" fill="#596683">数据：固定示范</text><text x="125" y="156" text-anchor="middle" font-size="15" fill="#596683">粒度：最密</text><rect x="38" y="195" width="174" height="45" rx="13" fill="#dfe4fa"/><text x="125" y="223" text-anchor="middle" font-size="14" fill="#34467e">擅长格式与行为模仿</text></g><g transform="translate(335 165)"><rect width="250" height="280" rx="22" fill="#edf0ff" stroke="#8799e9" stroke-width="2"/><text x="125" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#25345d">偏好 / DPO</text><text x="125" y="84" text-anchor="middle" font-size="15" fill="#596683">目标：A 优于 B</text><text x="125" y="120" text-anchor="middle" font-size="15" fill="#596683">数据：固定或迭代 pair</text><text x="125" y="156" text-anchor="middle" font-size="15" fill="#596683">粒度：整段排序</text><rect x="38" y="195" width="174" height="45" rx="13" fill="#dfe4fa"/><text x="125" y="223" text-anchor="middle" font-size="14" fill="#34467e">擅长主观选择</text></g><g transform="translate(610 165)"><rect width="250" height="280" rx="22" fill="#fff4e5" stroke="#dfa84e" stroke-width="2"/><text x="125" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#684c1e">RLVR / GRPO</text><text x="125" y="84" text-anchor="middle" font-size="15" fill="#745f43">目标：可执行结果奖励</text><text x="125" y="120" text-anchor="middle" font-size="15" fill="#745f43">数据：当前策略 rollout</text><text x="125" y="156" text-anchor="middle" font-size="15" fill="#745f43">粒度：结果稀疏</text><rect x="38" y="195" width="174" height="45" rx="13" fill="#f4dfb9"/><text x="125" y="223" text-anchor="middle" font-size="14" fill="#684c1e">擅长探索可验证解法</text></g><g transform="translate(885 165)"><rect width="250" height="280" rx="22" fill="#eaf8f4" stroke="#72baa7" stroke-width="2"/><text x="125" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#205c50">Agent RL</text><text x="125" y="84" text-anchor="middle" font-size="15" fill="#4c6f67">目标：环境终态与成本</text><text x="125" y="120" text-anchor="middle" font-size="15" fill="#4c6f67">数据：多步交互轨迹</text><text x="125" y="156" text-anchor="middle" font-size="15" fill="#4c6f67">粒度：长程、部分可观测</text><rect x="38" y="195" width="174" height="45" rx="13" fill="#d5eee8"/><text x="125" y="223" text-anchor="middle" font-size="14" fill="#205c50">擅长恢复与工具行为</text></g></g><path d="M185 487h830" stroke="#5368d9" stroke-width="4"/><path d="M1000 475l16 12-16 12" fill="none" stroke="#5368d9" stroke-width="4"/><text x="600" y="526" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#5c6787">探索自由度、在线成本、信用分配与安全复杂度增加</text></svg>
