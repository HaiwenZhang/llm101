<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">DAPO 针对长推理强化学习的四项修正</title>
  <desc id="desc">分别说明上裁剪、动态采样、token 级损失和超长奖励塑形解决的问题与代价。</desc>
  <rect width="1200" height="560" rx="30" fill="#f8faff"/>
  <text x="60" y="66" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#182342">DAPO：不是另一个缩写，而是对四个训练故障逐项修补</text>
  <text x="60" y="100" font-family="system-ui,sans-serif" font-size="17" fill="#5c6787">每一项都改变训练分布或梯度权重，因此需要独立消融和监控</text>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(60 150)"><rect width="255" height="320" rx="22" fill="#eef1ff" stroke="#8b9be7" stroke-width="2"/><circle cx="42" cy="44" r="22" fill="#5368d9"/><text x="42" y="51" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text><text x="78" y="51" font-size="20" font-weight="700" fill="#25345d">Clip-Higher</text><text x="28" y="101" font-size="15" fill="#596683">故障：低概率的好 token</text><text x="28" y="128" font-size="15" fill="#596683">上升空间被对称裁剪卡住</text><rect x="28" y="164" width="199" height="14" rx="7" fill="#d9dff8"/><rect x="80" y="164" width="106" height="14" rx="7" fill="#5368d9"/><path d="M186 152v38" stroke="#d95f55" stroke-width="3"/><text x="28" y="222" font-size="15" font-weight="700" fill="#34467e">做法</text><text x="28" y="248" font-size="14" fill="#596683">下界与上界分开设定</text><text x="28" y="274" font-size="14" fill="#596683">例如 0.80 / 1.28</text><text x="28" y="303" font-size="13" fill="#9a5e25">风险：上界过宽会不稳定</text></g>
    <g transform="translate(335 150)"><rect width="255" height="320" rx="22" fill="#eaf8f4" stroke="#77baa9" stroke-width="2"/><circle cx="42" cy="44" r="22" fill="#28987d"/><text x="42" y="51" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text><text x="78" y="51" font-size="20" font-weight="700" fill="#205c50">动态采样</text><text x="28" y="101" font-size="15" fill="#4c6f67">故障：全对 / 全错组</text><text x="28" y="128" font-size="15" fill="#4c6f67">优势全为 0，浪费 batch</text><g transform="translate(28 162)"><circle cx="12" cy="12" r="11" fill="#d76158"/><circle cx="46" cy="12" r="11" fill="#d76158"/><circle cx="80" cy="12" r="11" fill="#28987d"/><circle cx="114" cy="12" r="11" fill="#d76158"/><path d="M145 12h48" stroke="#28987d" stroke-width="3"/><path d="M185 4l10 8-10 8" fill="none" stroke="#28987d" stroke-width="3"/></g><text x="28" y="222" font-size="15" font-weight="700" fill="#205c50">做法</text><text x="28" y="248" font-size="14" fill="#4c6f67">继续采样直到装满混合组</text><text x="28" y="274" font-size="14" fill="#4c6f67">保证每题有正负样本</text><text x="28" y="303" font-size="13" fill="#9a5e25">风险：悄悄改变题目分布</text></g>
    <g transform="translate(610 150)"><rect width="255" height="320" rx="22" fill="#fff4e5" stroke="#dfa84e" stroke-width="2"/><circle cx="42" cy="44" r="22" fill="#cf8b2d"/><text x="42" y="51" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text><text x="78" y="51" font-size="20" font-weight="700" fill="#684c1e">Token 级损失</text><text x="28" y="101" font-size="15" fill="#745f43">故障：先按样本平均时</text><text x="28" y="128" font-size="15" fill="#745f43">长回答每个 token 权重更小</text><g transform="translate(28 160)" fill="#cf8b2d"><rect width="36" height="18" rx="5"/><rect x="43" width="36" height="18" rx="5"/><rect x="86" width="36" height="18" rx="5"/><rect x="129" width="36" height="18" rx="5"/><rect x="172" width="36" height="18" rx="5"/></g><text x="28" y="222" font-size="15" font-weight="700" fill="#684c1e">做法</text><text x="28" y="248" font-size="14" fill="#745f43">全 batch token 一起归约</text><text x="28" y="274" font-size="14" fill="#745f43">每个有效 token 权重一致</text><text x="28" y="303" font-size="13" fill="#9a5e25">风险：长轨迹占更多梯度</text></g>
    <g transform="translate(885 150)"><rect width="255" height="320" rx="22" fill="#fff0ef" stroke="#d8847e" stroke-width="2"/><circle cx="42" cy="44" r="22" fill="#d76158"/><text x="42" y="51" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">4</text><text x="78" y="51" font-size="20" font-weight="700" fill="#69332f">超长塑形</text><text x="28" y="101" font-size="15" fill="#76504d">故障：被截断不等于</text><text x="28" y="128" font-size="15" fill="#76504d">推理错误，硬罚会制造噪声</text><path d="M28 177h193" stroke="#d6a09c" stroke-width="8" stroke-linecap="round"/><path d="M154 177h67" stroke="#d76158" stroke-width="8" stroke-linecap="round"/><text x="28" y="222" font-size="15" font-weight="700" fill="#69332f">做法</text><text x="28" y="248" font-size="14" fill="#76504d">先屏蔽截断样本，或在</text><text x="28" y="274" font-size="14" fill="#76504d">缓冲区内逐渐增加长度罚</text><text x="28" y="303" font-size="13" fill="#9a5e25">风险：可能激励钻长度规则</text></g>
  </g>
  <text x="600" y="525" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#5c6787">论文结果说明这些修正对其特定模型、数据和系统有效；迁移到别的任务时仍需重新验证。</text>
</svg>
