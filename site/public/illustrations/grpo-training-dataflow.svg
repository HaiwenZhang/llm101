<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">GRPO 从题目到策略更新的数据流</title>
  <desc id="desc">同一道题由旧策略采样多条回答，经验证器评分和组内归一化后，使用概率比更新当前策略。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9ff"/><stop offset="1" stop-color="#fffaf3"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l9 5-9 5z" fill="#5368d9"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#24345f" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="600" rx="30" fill="url(#bg)"/>
  <text x="60" y="70" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#182342">一条训练样本不是“一问一答”，而是“一问一组回答”</text>
  <text x="60" y="104" font-family="system-ui,sans-serif" font-size="17" fill="#5c6787">相对优势来自同题比较；PPO 概率比则比较同一 token 在新旧策略下的概率</text>

  <g filter="url(#shadow)"><rect x="60" y="215" width="180" height="116" rx="20" fill="#fff" stroke="#bac5ef" stroke-width="2"/><text x="150" y="257" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#25345d">题目 q</text><text x="150" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#68728d">同一道数学题</text><text x="150" y="314" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#68728d">或代码任务</text></g>
  <path d="M240 273h68" stroke="#5368d9" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="320" y="195" width="190" height="156" rx="20" fill="#eef1ff" stroke="#8799e9" stroke-width="2"/><text x="415" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#25345d">旧策略 πold</text><text x="415" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#596683">固定一次 rollout</text><text x="415" y="297" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#596683">采样 G 条回答</text><rect x="356" y="316" width="118" height="8" rx="4" fill="#8799e9"/></g>
  <path d="M510 273h70" stroke="#5368d9" stroke-width="3" marker-end="url(#arrow)"/>

  <g font-family="system-ui,sans-serif">
    <g transform="translate(592 154)"><rect width="164" height="58" rx="16" fill="#fff" stroke="#b9c3df"/><text x="20" y="25" font-size="14" fill="#5c6787">回答 1</text><text x="142" y="37" text-anchor="end" font-size="24" font-weight="700" fill="#28987d">R=1</text></g>
    <g transform="translate(592 225)"><rect width="164" height="58" rx="16" fill="#fff" stroke="#b9c3df"/><text x="20" y="25" font-size="14" fill="#5c6787">回答 2</text><text x="142" y="37" text-anchor="end" font-size="24" font-weight="700" fill="#d76158">R=0</text></g>
    <g transform="translate(592 296)"><rect width="164" height="58" rx="16" fill="#fff" stroke="#b9c3df"/><text x="20" y="25" font-size="14" fill="#5c6787">回答 3</text><text x="142" y="37" text-anchor="end" font-size="24" font-weight="700" fill="#d76158">R=0</text></g>
    <g transform="translate(592 367)"><rect width="164" height="58" rx="16" fill="#fff" stroke="#b9c3df"/><text x="20" y="25" font-size="14" fill="#5c6787">回答 G</text><text x="142" y="37" text-anchor="end" font-size="24" font-weight="700" fill="#28987d">R=1</text></g>
  </g>
  <path d="M756 288h67" stroke="#5368d9" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="835" y="180" width="170" height="216" rx="20" fill="#fff7e9" stroke="#e2b867" stroke-width="2"/><text x="920" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#5e4520">组内比较</text><text x="920" y="259" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#745f43">减去组均值</text><text x="920" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#745f43">再除以标准差</text><line x1="872" y1="307" x2="968" y2="307" stroke="#e2b867"/><text x="920" y="339" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#28987d">成功：A &gt; 0</text><text x="920" y="369" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#d76158">失败：A &lt; 0</text></g>
  <path d="M1005 288h64" stroke="#5368d9" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="1080" y="215" width="82" height="146" rx="20" fill="#eaf8f4" stroke="#73bba8" stroke-width="2"/><text x="1121" y="253" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#205c50">当前</text><text x="1121" y="277" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#205c50">策略</text><path d="M1100 317l14 14 29-36" fill="none" stroke="#28987d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>

  <rect x="60" y="488" width="1102" height="66" rx="18" fill="#edf0ff"/><text x="92" y="516" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#34467e">两个比较轴不要混：</text><text x="92" y="540" font-family="system-ui,sans-serif" font-size="15" fill="#596683">组内奖励比较决定 A；新策略与旧策略的 token 概率比决定更新幅度。</text>
</svg>
