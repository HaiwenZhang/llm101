<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">语言模型 Agent 的观察、内部状态、动作与环境闭环</title><desc id="desc">环境经过观察接口变成文本或图像，内部状态融合目标和记忆，语言模型选择工具动作，动作改变环境并产生新观察。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l9 5-9 5z" fill="#5368d9"/></marker></defs><rect width="1200" height="560" rx="30" fill="#f8faff"/><text x="60" y="68" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#182342">Agent 不是“会写思维链的模型”，而是观察—状态—动作—环境闭环</text><text x="60" y="102" font-family="system-ui,sans-serif" font-size="17" fill="#5c6787">能力常被接口限制：看不到关键元素，后续推理再强也无法补回证据</text>
<g font-family="system-ui,sans-serif"><rect x="60" y="190" width="230" height="180" rx="22" fill="#fff4e5" stroke="#dfa84e" stroke-width="2"/><text x="175" y="232" text-anchor="middle" font-size="21" font-weight="700" fill="#684c1e">环境</text><text x="175" y="272" text-anchor="middle" font-size="15" fill="#745f43">网页 · 文件 · 用户</text><text x="175" y="300" text-anchor="middle" font-size="15" fill="#745f43">工具返回 · 权限状态</text><text x="175" y="337" text-anchor="middle" font-size="14" fill="#9a6a2d">有隐藏状态</text>
<rect x="365" y="165" width="220" height="230" rx="22" fill="#eef1ff" stroke="#8799e9" stroke-width="2"/><text x="475" y="207" text-anchor="middle" font-size="21" font-weight="700" fill="#25345d">观察接口</text><text x="475" y="246" text-anchor="middle" font-size="15" fill="#596683">HTML / ax-tree</text><text x="475" y="274" text-anchor="middle" font-size="15" fill="#596683">截图 / 文件片段</text><text x="475" y="302" text-anchor="middle" font-size="15" fill="#596683">检索与过滤</text><rect x="407" y="331" width="136" height="34" rx="17" fill="#5368d9"/><text x="475" y="353" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">信息瓶颈</text>
<rect x="660" y="145" width="220" height="270" rx="22" fill="#eaf8f4" stroke="#72baa7" stroke-width="2"/><text x="770" y="187" text-anchor="middle" font-size="21" font-weight="700" fill="#205c50">内部状态</text><text x="770" y="226" text-anchor="middle" font-size="15" fill="#4c6f67">目标 + 当前上下文</text><text x="770" y="254" text-anchor="middle" font-size="15" fill="#4c6f67">事实记忆 + 工作流</text><text x="770" y="299" text-anchor="middle" font-size="18" font-weight="700" fill="#205c50">LM policy</text><text x="770" y="332" text-anchor="middle" font-size="15" fill="#4c6f67">选择下一动作</text><text x="770" y="374" text-anchor="middle" font-size="14" fill="#4c6f67">状态可能过期或污染</text>
<rect x="955" y="190" width="185" height="180" rx="22" fill="#fff0ef" stroke="#d8847e" stroke-width="2"/><text x="1048" y="232" text-anchor="middle" font-size="21" font-weight="700" fill="#69332f">动作接口</text><text x="1048" y="272" text-anchor="middle" font-size="15" fill="#76504d">click / type</text><text x="1048" y="300" text-anchor="middle" font-size="15" fill="#76504d">API / skill</text><text x="1048" y="337" text-anchor="middle" font-size="14" fill="#a64f48">受权限硬约束</text></g>
<path d="M290 280h57M585 280h57M880 280h57" stroke="#5368d9" stroke-width="4" marker-end="url(#a)"/><path d="M1048 385c0 110-873 110-873 2" fill="none" stroke="#d76158" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="600" y="505" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#6d3b37">动作改变环境；真实新观察回来后再规划，而不是把模型想象当环境事实。</text></svg>
