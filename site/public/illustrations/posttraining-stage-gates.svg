<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">多阶段后训练管线和阶段门</title><desc id="desc">基础模型依次经过 SFT、偏好优化、可验证强化学习和 Agent 环境，每个阶段都通过能力、安全、长度和成本评测门。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l9 5-9 5z" fill="#5368d9"/></marker></defs><rect width="1200" height="540" rx="30" fill="#f8faff"/><text x="60" y="68" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#182342">多阶段不是“越训越强”的单行道，每一步都可能换来新能力和新退化</text><text x="60" y="102" font-family="system-ui,sans-serif" font-size="17" fill="#5c6787">阶段门比较当前模型、上一个 checkpoint 与冻结 reference，而不是只看一个总分</text>
<g font-family="system-ui,sans-serif"><g transform="translate(55 175)"><rect width="190" height="130" rx="20" fill="#eef1ff" stroke="#8799e9" stroke-width="2"/><text x="95" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#25345d">Base</text><text x="95" y="83" text-anchor="middle" font-size="14" fill="#596683">语言与知识底座</text></g><g transform="translate(330 175)"><rect width="190" height="130" rx="20" fill="#edf0ff" stroke="#8799e9" stroke-width="2"/><text x="95" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#25345d">SFT</text><text x="95" y="83" text-anchor="middle" font-size="14" fill="#596683">格式 · 指令 · 工具示范</text></g><g transform="translate(605 175)"><rect width="190" height="130" rx="20" fill="#fff4e5" stroke="#dfa84e" stroke-width="2"/><text x="95" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#684c1e">Preference</text><text x="95" y="83" text-anchor="middle" font-size="14" fill="#745f43">帮助性 · 风格 · 安全</text></g><g transform="translate(880 175)"><rect width="260" height="130" rx="20" fill="#eaf8f4" stroke="#72baa7" stroke-width="2"/><text x="130" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#205c50">RLVR / Agent RL</text><text x="130" y="83" text-anchor="middle" font-size="14" fill="#4c6f67">推理 · 工具 · 环境成功</text></g></g><path d="M245 240h67M520 240h67M795 240h67" stroke="#5368d9" stroke-width="4" marker-end="url(#a)"/><g font-family="system-ui,sans-serif"><rect x="260" y="365" width="680" height="105" rx="20" fill="#fff0ef"/><text x="600" y="397" text-anchor="middle" font-size="17" font-weight="700" fill="#69332f">每一阶段共同的回归门</text><text x="600" y="431" text-anchor="middle" font-size="15" fill="#76504d">任务能力 · 多语言 · 拒答 · 长度 · KL · 安全 · 延迟/成本 · reward hacking</text><text x="600" y="455" text-anchor="middle" font-size="14" fill="#76504d">失败：回滚 checkpoint、查数据和奖励，不让后续阶段掩盖退化</text></g></svg>
