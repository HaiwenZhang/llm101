<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">vLLM V1 从 API 请求到 GPU 执行和流式输出的路径</title>
  <desc id="desc">API Server 接收请求并送入 Engine Core。Engine Core 中的 Scheduler 分配 token budget，KV Cache Manager 分配物理块。GPU Worker 的 Model Runner 构造输入、位置、slot mapping 和 block table，Attention Backend 访问模型权重与分页 KV Cache，Sampler 产生 token 并流式返回。</desc>
  <rect width="1200" height="720" rx="30" fill="#f8faff"/>
  <text x="52" y="62" font-family="system-ui,sans-serif" font-size="29" font-weight="700" fill="#182342">一条请求在 vLLM V1 中怎样走完一轮</text>
  <text x="52" y="98" font-family="system-ui,sans-serif" font-size="16" fill="#5c6787">控制面决定“本轮算谁、KV 放哪”；数据面把选中的 token 压成 GPU 批次并执行</text>

  <g font-family="system-ui,sans-serif">
    <rect x="48" y="142" width="1104" height="202" rx="24" fill="#eef1ff" stroke="#8b97c6" stroke-width="2"/>
    <text x="70" y="174" font-size="15" font-weight="700" fill="#354474">CPU / 控制面</text>

    <g transform="translate(78 204)">
      <rect width="180" height="92" rx="16" fill="#fff" stroke="#9aa6d2"/>
      <text x="90" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#28365f">API Server</text>
      <text x="90" y="59" text-anchor="middle" font-size="12" fill="#5c6787">校验、分词、流式连接</text>
      <text x="90" y="77" text-anchor="middle" font-size="11" fill="#5c6787">OpenAI-compatible API</text>
    </g>

    <path d="M268 250h48" stroke="#6977ad" stroke-width="3"/><path d="m306 243 12 7-12 7" fill="none" stroke="#6977ad" stroke-width="3"/>

    <g transform="translate(328 190)">
      <rect width="438" height="120" rx="18" fill="#fff" stroke="#9aa6d2" stroke-width="2"/>
      <text x="219" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#28365f">Engine Core</text>
      <rect x="18" y="44" width="190" height="58" rx="12" fill="#e5e9fb"/>
      <text x="113" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#354474">Scheduler</text>
      <text x="113" y="88" text-anchor="middle" font-size="11" fill="#5c6787">请求队列 · token budget</text>
      <rect x="230" y="44" width="190" height="58" rx="12" fill="#e5e9fb"/>
      <text x="325" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#354474">KVCacheManager</text>
      <text x="325" y="88" text-anchor="middle" font-size="11" fill="#5c6787">Block Pool · 前缀命中</text>
    </g>

    <path d="M776 250h48" stroke="#6977ad" stroke-width="3"/><path d="m814 243 12 7-12 7" fill="none" stroke="#6977ad" stroke-width="3"/>

    <g transform="translate(836 204)">
      <rect width="280" height="92" rx="16" fill="#fff" stroke="#9aa6d2"/>
      <text x="140" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#28365f">SchedulerOutput</text>
      <text x="140" y="59" text-anchor="middle" font-size="12" fill="#5c6787">request IDs · scheduled tokens</text>
      <text x="140" y="77" text-anchor="middle" font-size="11" fill="#5c6787">new blocks · cached blocks · copies</text>
    </g>

    <path d="M976 306v60" stroke="#6977ad" stroke-width="3"/><path d="m969 356 7 12 7-12" fill="none" stroke="#6977ad" stroke-width="3"/>

    <rect x="48" y="376" width="1104" height="258" rx="24" fill="#eaf8f4" stroke="#72baa7" stroke-width="2"/>
    <text x="70" y="408" font-size="15" font-weight="700" fill="#205c50">GPU / 数据面</text>

    <g transform="translate(78 438)">
      <rect width="270" height="150" rx="18" fill="#fff" stroke="#9dcfc3" stroke-width="2"/>
      <text x="135" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#205c50">GPU Worker · ModelRunner</text>
      <g font-size="11" fill="#4c6f67">
        <text x="20" y="58">① gather input IDs / positions</text>
        <text x="20" y="80">② 更新 persistent batch</text>
        <text x="20" y="102">③ 构造 slot mapping / block table</text>
        <text x="20" y="124">④ 调用 compiled model forward</text>
      </g>
    </g>

    <path d="M358 513h48" stroke="#72baa7" stroke-width="3"/><path d="m396 506 12 7-12 7" fill="none" stroke="#72baa7" stroke-width="3"/>

    <g transform="translate(418 438)">
      <rect width="248" height="150" rx="18" fill="#fff" stroke="#9dcfc3" stroke-width="2"/>
      <text x="124" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#205c50">Attention Backend</text>
      <rect x="18" y="48" width="212" height="38" rx="10" fill="#d5eee8"/>
      <text x="124" y="72" text-anchor="middle" font-size="12" fill="#205c50">读取 Block Table → 定位历史 K/V</text>
      <rect x="18" y="96" width="212" height="38" rx="10" fill="#d5eee8"/>
      <text x="124" y="120" text-anchor="middle" font-size="12" fill="#205c50">写入新 token 的 KV slot</text>
    </g>

    <path d="M676 513h44" stroke="#72baa7" stroke-width="3"/><path d="m710 506 12 7-12 7" fill="none" stroke="#72baa7" stroke-width="3"/>

    <g transform="translate(732 424)">
      <rect width="190" height="178" rx="18" fill="#fff" stroke="#9dcfc3" stroke-width="2"/>
      <text x="95" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#205c50">GPU Memory</text>
      <rect x="18" y="48" width="154" height="42" rx="10" fill="#d5eee8"/><text x="95" y="73" text-anchor="middle" font-size="12" fill="#205c50">模型权重</text>
      <g transform="translate(18 101)" font-size="10" fill="#205c50">
        <rect width="44" height="44" rx="7" fill="#d5eee8"/><text x="22" y="26" text-anchor="middle">P7</text>
        <rect x="55" width="44" height="44" rx="7" fill="#d5eee8"/><text x="77" y="26" text-anchor="middle">P2</text>
        <rect x="110" width="44" height="44" rx="7" fill="#d5eee8"/><text x="132" y="26" text-anchor="middle">P11</text>
      </g>
      <text x="95" y="164" text-anchor="middle" font-size="11" fill="#4c6f67">分页 KV Cache</text>
    </g>

    <path d="M932 513h36" stroke="#72baa7" stroke-width="3"/><path d="m958 506 12 7-12 7" fill="none" stroke="#72baa7" stroke-width="3"/>

    <g transform="translate(980 452)">
      <rect width="136" height="122" rx="18" fill="#fff" stroke="#9dcfc3" stroke-width="2"/>
      <text x="68" y="31" text-anchor="middle" font-size="15" font-weight="700" fill="#205c50">Sampler</text>
      <text x="68" y="58" text-anchor="middle" font-size="11" fill="#4c6f67">logits → token</text>
      <path d="M22 78h92" stroke="#72baa7" stroke-width="2"/>
      <text x="68" y="101" text-anchor="middle" font-size="11" fill="#4c6f67">回传 / 再入队</text>
    </g>
  </g>

  <rect x="190" y="661" width="820" height="38" rx="12" fill="#eef1ff"/>
  <text x="600" y="685" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#354474">PagedAttention 不是单独一段代码：调度器、块分配、元数据准备和 GPU kernel 必须共同配合</text>
</svg>
