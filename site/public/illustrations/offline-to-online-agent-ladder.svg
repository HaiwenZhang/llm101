<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Agent 从离线示范到真实在线环境的安全阶梯</title><desc id="desc">先行为克隆，再离线偏好，进入可重置沙箱在线探索，最后才小流量低权限真实环境，并在各层设置评测门。</desc><rect width="1200" height="540" rx="30" fill="#f8faff"/><text x="60" y="68" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#182342">探索权限按证据逐层放大，不从静态日志直接跳到生产环境</text><text x="60" y="102" font-family="system-ui,sans-serif" font-size="17" fill="#5c6787">每一级都要有独立成功率、安全门和可回滚环境</text>
<g font-family="system-ui,sans-serif"><g transform="translate(70 350)"><rect width="230" height="110" rx="20" fill="#eef1ff" stroke="#8799e9" stroke-width="2"/><text x="115" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#25345d">1 · 示范 / BC</text><text x="115" y="72" text-anchor="middle" font-size="14" fill="#596683">学会基本接口和格式</text></g><g transform="translate(335 285)"><rect width="230" height="175" rx="20" fill="#edf0ff" stroke="#8799e9" stroke-width="2"/><text x="115" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#25345d">2 · 离线优化</text><text x="115" y="72" text-anchor="middle" font-size="14" fill="#596683">偏好 / 保守价值</text><text x="115" y="102" text-anchor="middle" font-size="14" fill="#596683">不信分布外动作</text></g><g transform="translate(600 215)"><rect width="230" height="245" rx="20" fill="#fff4e5" stroke="#dfa84e" stroke-width="2"/><text x="115" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#684c1e">3 · 可重置沙箱</text><text x="115" y="72" text-anchor="middle" font-size="14" fill="#745f43">当前策略在线探索</text><text x="115" y="102" text-anchor="middle" font-size="14" fill="#745f43">隐藏测试 · 权限隔离</text><text x="115" y="132" text-anchor="middle" font-size="14" fill="#745f43">收集失败与恢复状态</text></g><g transform="translate(865 145)"><rect width="265" height="315" rx="20" fill="#eaf8f4" stroke="#72baa7" stroke-width="2"/><text x="133" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#205c50">4 · 低权限真实环境</text><text x="133" y="72" text-anchor="middle" font-size="14" fill="#4c6f67">小流量 · shadow mode</text><text x="133" y="102" text-anchor="middle" font-size="14" fill="#4c6f67">写操作审批</text><text x="133" y="132" text-anchor="middle" font-size="14" fill="#4c6f67">实时审计与一键回滚</text><rect x="43" y="190" width="180" height="52" rx="14" fill="#fff0ef"/><text x="133" y="222" text-anchor="middle" font-size="14" fill="#6d3b37">安全门不由 reward 覆盖</text></g></g><path d="M300 380h35M565 315h35M830 245h35" stroke="#5368d9" stroke-width="4"/></svg>
