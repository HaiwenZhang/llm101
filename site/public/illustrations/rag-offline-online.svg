<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">RAG 离线建库与在线检索的双路径</title>
  <desc id="desc">离线路径从原始文件解析、结构切块、权限和版本元数据、稀疏与稠密表示，最终构建倒排与向量索引。在线路径从用户和历史生成查询，应用权限版本过滤，执行混合召回、融合去重与重排，输出带原文指针的证据包。</desc>
  <rect width="1200" height="680" rx="30" fill="#f8faff"/>
  <text x="55" y="63" font-family="system-ui,sans-serif" font-size="29" font-weight="700" fill="#182342">RAG 检索不是“一次向量搜索”，而是离线建库 + 在线查询两条流水线</text>
  <text x="55" y="99" font-family="system-ui,sans-serif" font-size="17" fill="#5c6787">每个阶段都有独立产物和验收指标，便于定位正确证据究竟在哪一步消失</text>
  <g font-family="system-ui,sans-serif">
    <text x="55" y="151" font-size="18" font-weight="700" fill="#25345d">离线：文档变化时运行</text>
    <g transform="translate(55 174)" font-size="12" fill="#25345d">
      <g><rect width="180" height="114" rx="16" fill="#eef1ff" stroke="#8799e9" stroke-width="2"/><text x="90" y="29" text-anchor="middle" font-size="16" font-weight="700">① 解析</text><text x="90" y="55" text-anchor="middle">PDF / HTML / 表格</text><text x="90" y="76" text-anchor="middle">页码、标题、单元格保真</text><rect x="27" y="89" width="126" height="18" rx="5" fill="#dfe4fa"/><text x="90" y="102" text-anchor="middle" font-size="10">指标：解析正确率</text></g>
      <g transform="translate(215)"><rect width="180" height="114" rx="16" fill="#fff4e5" stroke="#dfa84e" stroke-width="2"/><text x="90" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#684c1e">② 切块</text><text x="90" y="55" text-anchor="middle" fill="#745f43">结构 / 长度 / overlap</text><text x="90" y="76" text-anchor="middle" fill="#745f43">父子块 + 原文字符指针</text><rect x="27" y="89" width="126" height="18" rx="5" fill="#f4dfb9"/><text x="90" y="102" text-anchor="middle" font-size="10" fill="#684c1e">指标：gold chunk 可检索</text></g>
      <g transform="translate(430)"><rect width="180" height="114" rx="16" fill="#eaf8f4" stroke="#72baa7" stroke-width="2"/><text x="90" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#205c50">③ 元数据</text><text x="90" y="55" text-anchor="middle" fill="#4c6f67">版本 / 日期 / ACL</text><text x="90" y="76" text-anchor="middle" fill="#4c6f67">content hash / parser 版本</text><rect x="27" y="89" width="126" height="18" rx="5" fill="#d5eee8"/><text x="90" y="102" text-anchor="middle" font-size="10" fill="#205c50">指标：权限与版本完整率</text></g>
      <g transform="translate(645)"><rect width="180" height="114" rx="16" fill="#f3efff" stroke="#a28de1" stroke-width="2"/><text x="90" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#44336d">④ 表示</text><text x="90" y="55" text-anchor="middle" fill="#665682">BM25 term / embedding</text><text x="90" y="76" text-anchor="middle" fill="#665682">模型与归一化版本</text><rect x="27" y="89" width="126" height="18" rx="5" fill="#dfd5fa"/><text x="90" y="102" text-anchor="middle" font-size="10" fill="#44336d">指标：向量与文档对齐</text></g>
      <g transform="translate(860)"><rect width="230" height="114" rx="16" fill="#fff0ef" stroke="#d9867f" stroke-width="2"/><text x="115" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#6f2e2a">⑤ 索引</text><text x="115" y="55" text-anchor="middle" fill="#805450">倒排索引 + HNSW/PQ</text><text x="115" y="76" text-anchor="middle" fill="#805450">增量更新 / 删除 / tombstone</text><rect x="38" y="89" width="154" height="18" rx="5" fill="#f6d6d3"/><text x="115" y="102" text-anchor="middle" font-size="10" fill="#6f2e2a">指标：Recall–Latency–Memory</text></g>
    </g>
    <g fill="none" stroke="#5368d9" stroke-width="3"><path d="M235 231h25"/><path d="M450 231h25"/><path d="M665 231h25"/><path d="M880 231h25"/></g><g fill="#5368d9"><path d="M260 231l-10-7v14z"/><path d="M475 231l-10-7v14z"/><path d="M690 231l-10-7v14z"/><path d="M905 231l-10-7v14z"/></g>
    <path d="M1100 300v55H970" fill="none" stroke="#d9867f" stroke-width="3"/><path d="M980 348l-11 7 11 7" fill="none" stroke="#d9867f" stroke-width="3"/>
    <text x="55" y="377" font-size="18" font-weight="700" fill="#25345d">在线：每个问题运行</text>
    <g transform="translate(55 402)" font-size="12">
      <g><rect width="190" height="118" rx="16" fill="#eef1ff" stroke="#8799e9" stroke-width="2"/><text x="95" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#25345d">⑥ 查询构造</text><text x="95" y="58" text-anchor="middle" fill="#596683">原问 + 对话指代</text><text x="95" y="79" text-anchor="middle" fill="#596683">不要在改写时编答案</text><rect x="29" y="94" width="132" height="18" rx="5" fill="#dfe4fa"/><text x="95" y="107" text-anchor="middle" font-size="10" fill="#25345d">指标：意图保持率</text></g>
      <g transform="translate(225)"><rect width="190" height="118" rx="16" fill="#fff4e5" stroke="#dfa84e" stroke-width="2"/><text x="95" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#684c1e">⑦ 过滤 + 多路召回</text><text x="95" y="58" text-anchor="middle" fill="#745f43">ACL / 版本先过滤</text><text x="95" y="79" text-anchor="middle" fill="#745f43">BM25 ∪ Dense</text><rect x="29" y="94" width="132" height="18" rx="5" fill="#f4dfb9"/><text x="95" y="107" text-anchor="middle" font-size="10" fill="#684c1e">指标：Recall@K</text></g>
      <g transform="translate(450)"><rect width="190" height="118" rx="16" fill="#eaf8f4" stroke="#72baa7" stroke-width="2"/><text x="95" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#205c50">⑧ 融合去重</text><text x="95" y="58" text-anchor="middle" fill="#4c6f67">RRF / score calibration</text><text x="95" y="79" text-anchor="middle" fill="#4c6f67">父子块与近重复合并</text><rect x="29" y="94" width="132" height="18" rx="5" fill="#d5eee8"/><text x="95" y="107" text-anchor="middle" font-size="10" fill="#205c50">指标：候选覆盖与冗余</text></g>
      <g transform="translate(675)"><rect width="190" height="118" rx="16" fill="#f3efff" stroke="#a28de1" stroke-width="2"/><text x="95" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#44336d">⑨ 重排</text><text x="95" y="58" text-anchor="middle" fill="#665682">Cross-Encoder / LLM</text><text x="95" y="79" text-anchor="middle" fill="#665682">判断“能否支持回答”</text><rect x="29" y="94" width="132" height="18" rx="5" fill="#dfd5fa"/><text x="95" y="107" text-anchor="middle" font-size="10" fill="#44336d">指标：MRR / nDCG</text></g>
      <g transform="translate(900)"><rect width="190" height="118" rx="16" fill="#fff0ef" stroke="#d9867f" stroke-width="2"/><text x="95" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#6f2e2a">⑩ 证据包</text><text x="95" y="58" text-anchor="middle" fill="#805450">原文 + source_id + page</text><text x="95" y="79" text-anchor="middle" fill="#805450">版本 / ACL / 字符指针</text><rect x="29" y="94" width="132" height="18" rx="5" fill="#f6d6d3"/><text x="95" y="107" text-anchor="middle" font-size="10" fill="#6f2e2a">指标：evidence Recall@budget</text></g>
    </g>
    <g fill="none" stroke="#5368d9" stroke-width="3"><path d="M245 461h25"/><path d="M470 461h25"/><path d="M695 461h25"/><path d="M920 461h25"/></g><g fill="#5368d9"><path d="M270 461l-10-7v14z"/><path d="M495 461l-10-7v14z"/><path d="M720 461l-10-7v14z"/><path d="M945 461l-10-7v14z"/></g>
  </g>
  <rect x="110" y="575" width="980" height="51" rx="14" fill="#eef1ff"/><text x="600" y="598" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#25345d">故障定位顺序：gold chunk 是否存在 → 是否召回 → 是否进入预算 → 是否被生成器正确使用</text><text x="600" y="617" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#596683">只看最终答案，无法判断错误来自解析、索引、检索、重排还是生成</text>
</svg>
