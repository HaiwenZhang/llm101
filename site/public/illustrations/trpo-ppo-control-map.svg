<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">TRPO、PPO-KL 与 PPO-Clip 的策略更新控制方式</title>
  <desc id="desc">TRPO 在 KL 约束区域内优化，PPO-KL 用惩罚软约束，PPO-Clip 对样本概率比收益封顶。</desc>
  <rect width="1200" height="520" rx="30" fill="#f8faff"/>
  <text x="60" y="68" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#182342">三种方法都想“小步更新”，但约束对象不同</text>
  <text x="60" y="102" font-family="system-ui,sans-serif" font-size="17" fill="#5c6787">不要把概率比裁剪误读成严格的全局 KL 信赖域</text>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(60 150)"><rect width="335" height="285" rx="22" fill="#eef1ff" stroke="#8799e9" stroke-width="2"/><text x="168" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="#25345d">TRPO：硬约束</text><ellipse cx="168" cy="155" rx="102" ry="65" fill="#dfe4fa" stroke="#5368d9" stroke-width="3"/><circle cx="135" cy="173" r="8" fill="#34467e"/><circle cx="215" cy="128" r="9" fill="#28987d"/><path d="M145 168l56-33" stroke="#5368d9" stroke-width="4"/><text x="168" y="243" text-anchor="middle" font-size="15" fill="#596683">近似求解：最大化代理收益</text><text x="168" y="267" text-anchor="middle" font-size="15" fill="#596683">且平均 KL 不超过 δ</text></g>
    <g transform="translate(432 150)"><rect width="335" height="285" rx="22" fill="#eaf8f4" stroke="#72baa7" stroke-width="2"/><text x="168" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="#205c50">PPO-KL：软惩罚</text><path d="M65 200c45-120 90-90 115-40s65 62 96-55" fill="none" stroke="#28987d" stroke-width="5"/><path d="M65 215c42-42 88-56 135-75s80-36 92-70" fill="none" stroke="#d5a44a" stroke-width="3" stroke-dasharray="8 7"/><text x="168" y="243" text-anchor="middle" font-size="15" fill="#4c6f67">目标减去 β·KL</text><text x="168" y="267" text-anchor="middle" font-size="15" fill="#4c6f67">β 可按观测 KL 自适应</text></g>
    <g transform="translate(804 150)"><rect width="335" height="285" rx="22" fill="#fff4e5" stroke="#dfa84e" stroke-width="2"/><text x="168" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="#684c1e">PPO-Clip：样本裁剪</text><line x1="58" y1="200" x2="280" y2="200" stroke="#c3af8d"/><path d="M58 190l82-75h70l70 0" fill="none" stroke="#cf8b2d" stroke-width="5"/><line x1="140" y1="95" x2="140" y2="212" stroke="#c1852e" stroke-dasharray="6 5"/><line x1="210" y1="95" x2="210" y2="212" stroke="#c1852e" stroke-dasharray="6 5"/><text x="168" y="243" text-anchor="middle" font-size="15" fill="#745f43">对这批样本的 ratio·A</text><text x="168" y="267" text-anchor="middle" font-size="15" fill="#745f43">越界收益封顶，简单一阶优化</text></g>
  </g>
  <text x="600" y="480" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#5c6787">共同目标：旧优势仍可信时才复用数据；差异过大后，应停止更新并重新 rollout。</text>
</svg>
