<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">带验证门的 Prompt Chain</title>
  <desc id="desc">复杂任务依次经过规范化输入、分解计划、检索或工具、草稿生成和确定性验证。验证失败时只把错误类型与必要上下文送回对应阶段重试，验证通过后才交付结果。</desc>
  <rect width="1200" height="650" rx="30" fill="#f8faff"/>
  <text x="55" y="63" font-family="system-ui,sans-serif" font-size="29" font-weight="700" fill="#182342">Prompt Chain 的价值：把一次大失败拆成可定位、可重试的小失败</text>
  <text x="55" y="99" font-family="system-ui,sans-serif" font-size="17" fill="#5c6787">每一步都有输入契约、输出契约和验收门；“模型说完成了”不等于系统验证通过</text>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(55 175)"><rect width="180" height="175" rx="18" fill="#eef1ff" stroke="#8799e9" stroke-width="2"/><text x="90" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#25345d">① 输入规范化</text><text x="90" y="77" text-anchor="middle" font-size="13" fill="#596683">字段完整？</text><text x="90" y="101" text-anchor="middle" font-size="13" fill="#596683">数据与指令分隔？</text><text x="90" y="125" text-anchor="middle" font-size="13" fill="#596683">缺什么先追问？</text><rect x="31" y="144" width="118" height="22" rx="6" fill="#dfe4fa"/><text x="90" y="160" text-anchor="middle" font-size="11" fill="#25345d">输出：任务对象</text></g>
    <g transform="translate(275 175)"><rect width="180" height="175" rx="18" fill="#fff4e5" stroke="#dfa84e" stroke-width="2"/><text x="90" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#684c1e">② 计划 / 分解</text><text x="90" y="77" text-anchor="middle" font-size="13" fill="#745f43">子问题覆盖目标？</text><text x="90" y="101" text-anchor="middle" font-size="13" fill="#745f43">依赖顺序正确？</text><text x="90" y="125" text-anchor="middle" font-size="13" fill="#745f43">哪些步骤需工具？</text><rect x="31" y="144" width="118" height="22" rx="6" fill="#f4dfb9"/><text x="90" y="160" text-anchor="middle" font-size="11" fill="#684c1e">输出：结构化计划</text></g>
    <g transform="translate(495 175)"><rect width="180" height="175" rx="18" fill="#eaf8f4" stroke="#72baa7" stroke-width="2"/><text x="90" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#205c50">③ 检索 / 工具</text><text x="90" y="77" text-anchor="middle" font-size="13" fill="#4c6f67">权限检查</text><text x="90" y="101" text-anchor="middle" font-size="13" fill="#4c6f67">真实执行结果</text><text x="90" y="125" text-anchor="middle" font-size="13" fill="#4c6f67">来源与时间戳</text><rect x="31" y="144" width="118" height="22" rx="6" fill="#d5eee8"/><text x="90" y="160" text-anchor="middle" font-size="11" fill="#205c50">输出：可追溯证据</text></g>
    <g transform="translate(715 175)"><rect width="180" height="175" rx="18" fill="#f3efff" stroke="#a28de1" stroke-width="2"/><text x="90" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#44336d">④ 生成草稿</text><text x="90" y="77" text-anchor="middle" font-size="13" fill="#665682">只用允许证据</text><text x="90" y="101" text-anchor="middle" font-size="13" fill="#665682">满足输出 schema</text><text x="90" y="125" text-anchor="middle" font-size="13" fill="#665682">标注不确定性</text><rect x="31" y="144" width="118" height="22" rx="6" fill="#dfd5fa"/><text x="90" y="160" text-anchor="middle" font-size="11" fill="#44336d">输出：候选答案</text></g>
    <g transform="translate(935 175)"><rect width="210" height="175" rx="18" fill="#fff0ef" stroke="#d9867f" stroke-width="2"/><text x="105" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#6f2e2a">⑤ 验证门</text><text x="105" y="72" text-anchor="middle" font-size="13" fill="#805450">JSON / SQL / 计算器</text><text x="105" y="96" text-anchor="middle" font-size="13" fill="#805450">引用覆盖 / 业务规则</text><text x="105" y="120" text-anchor="middle" font-size="13" fill="#805450">安全与权限</text><rect x="25" y="141" width="75" height="25" rx="7" fill="#e9a8a2"/><text x="62" y="158" text-anchor="middle" font-size="11" fill="#6f2e2a">FAIL</text><rect x="110" y="141" width="75" height="25" rx="7" fill="#d5eee8"/><text x="147" y="158" text-anchor="middle" font-size="11" fill="#205c50">PASS</text></g>
  </g>
  <g fill="none" stroke="#5368d9" stroke-width="3"><path d="M235 262h30"/><path d="M455 262h30"/><path d="M675 262h30"/><path d="M895 262h30"/></g><g fill="#5368d9"><path d="M265 262l-10-7v14z"/><path d="M485 262l-10-7v14z"/><path d="M705 262l-10-7v14z"/><path d="M925 262l-10-7v14z"/></g>
  <path d="M997 358v104H585v-102" fill="none" stroke="#d9867f" stroke-width="3"/><path d="M578 372l7-12 7 12" fill="none" stroke="#d9867f" stroke-width="3"/>
  <rect x="655" y="427" width="270" height="66" rx="13" fill="#fff0ef"/><text x="790" y="450" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6f2e2a">失败只返回：错误类型 + 最小必要上下文</text><text x="790" y="473" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#805450">不要让模型在无新信息时无限自我重试</text>
  <path d="M1082 358v151" stroke="#419b83" stroke-width="3"/><path d="M1075 500l7 11 7-11" fill="none" stroke="#419b83" stroke-width="3"/>
  <rect x="957" y="523" width="188" height="46" rx="12" fill="#d5eee8"/><text x="1051" y="551" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#205c50">交付结果 + 审计记录</text>
  <rect x="105" y="541" width="760" height="45" rx="13" fill="#eef1ff"/><text x="485" y="569" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#25345d">需要记录：每步输入版本、模型/参数、工具观察、验证结果、重试次数、token 与延迟</text>
</svg>
