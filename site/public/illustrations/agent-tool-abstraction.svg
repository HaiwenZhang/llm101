<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">原始界面动作与封装工具动作的差异</title><desc id="desc">原始点击序列长且难验证，语义工具把多步操作压缩成有类型参数、前置条件和后置条件的一步。</desc><rect width="1200" height="540" rx="30" fill="#f8faff"/><text x="60" y="68" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#182342">工具抽象减少决策步数，也把验证边界变清楚</text><text x="60" y="102" font-family="system-ui,sans-serif" font-size="17" fill="#5c6787">但封装工具权限更强，必须同时设计类型、前置条件、后置条件与审计</text>
<g font-family="system-ui,sans-serif"><rect x="70" y="155" width="480" height="300" rx="22" fill="#fff0ef" stroke="#d8847e" stroke-width="2"/><text x="310" y="198" text-anchor="middle" font-size="21" font-weight="700" fill="#69332f">原始动作：20 次 click / fill</text><g fill="#d76158"><circle cx="122" cy="260" r="15"/><circle cx="174" cy="300" r="15"/><circle cx="226" cy="245" r="15"/><circle cx="278" cy="330" r="15"/><circle cx="330" cy="270" r="15"/><circle cx="382" cy="344" r="15"/><circle cx="434" cy="286" r="15"/><circle cx="486" cy="355" r="15"/></g><path d="M122 260l52 40 52-55 52 85 52-60 52 74 52-58 52 69" fill="none" stroke="#d76158" stroke-width="4"/><text x="310" y="410" text-anchor="middle" font-size="15" fill="#76504d">每步都可能点错；页面变化后 ID 失效</text>
<rect x="650" y="155" width="480" height="300" rx="22" fill="#eaf8f4" stroke="#72baa7" stroke-width="2"/><text x="890" y="198" text-anchor="middle" font-size="21" font-weight="700" fill="#205c50">语义工具：一次可验证调用</text><rect x="720" y="240" width="340" height="85" rx="16" fill="#fff" stroke="#72baa7"/><text x="890" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#205c50">update_address(customer, address)</text><text x="890" y="302" text-anchor="middle" font-size="14" fill="#4c6f67">typed args · permission · idempotency</text><path d="M820 360h140" stroke="#28987d" stroke-width="5"/><path d="M945 348l16 12-16 12" fill="none" stroke="#28987d" stroke-width="5"/><text x="890" y="410" text-anchor="middle" font-size="15" fill="#4c6f67">后置条件：读取地址并核对已写入</text></g></svg>
