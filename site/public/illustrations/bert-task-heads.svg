<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">BERT 上下文表示连接四种下游任务头</title>
  <desc id="desc">同一个双向 Encoder 输出每个位置的隐藏向量。句子分类读取 CLS 向量，命名实体识别读取每个 token 向量，抽取式问答对每个位置预测开始与结束分数，句对分类把两段文本拼接后用 Cross-Encoder 联合编码。</desc>
  <rect width="1200" height="650" rx="30" fill="#f8faff"/>
  <text x="55" y="63" font-family="system-ui,sans-serif" font-size="29" font-weight="700" fill="#182342">BERT 不换骨架，主要换“从哪些位置读答案”</text>
  <text x="55" y="99" font-family="system-ui,sans-serif" font-size="17" fill="#5c6787">Encoder 输出 H∈ℝᴮˣᵀˣᵈ；任务头把 H 映射成类别、token 标签或文本区间</text>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(55 150)">
      <rect width="255" height="365" rx="20" fill="#eef1ff" stroke="#8799e9" stroke-width="2"/>
      <text x="127" y="39" text-anchor="middle" font-size="20" font-weight="700" fill="#25345d">① 整句分类</text>
      <g transform="translate(25 80)" font-size="12" fill="#25345d"><rect width="205" height="39" rx="8" fill="#dfe4fa"/><text x="102" y="25" text-anchor="middle">[CLS] 这个产品很难用 [SEP]</text><path d="M102 46v36" stroke="#5368d9" stroke-width="3"/><path d="M95 74l7 10 7-10" fill="none" stroke="#5368d9" stroke-width="3"/><rect y="88" width="205" height="45" rx="8" fill="#dfe4fa"/><text x="102" y="115" text-anchor="middle">取 H[:, 0, :] → [B,d]</text><path d="M102 140v36" stroke="#5368d9" stroke-width="3"/><path d="M95 168l7 10 7-10" fill="none" stroke="#5368d9" stroke-width="3"/><rect y="182" width="205" height="45" rx="8" fill="#dfe4fa"/><text x="102" y="209" text-anchor="middle">Linear → [B,C]</text></g>
      <rect x="25" y="319" width="205" height="27" rx="7" fill="#dfe4fa"/><text x="127" y="338" text-anchor="middle" font-size="12" fill="#25345d">情感 / 主题 / 是否违规</text>
    </g>
    <g transform="translate(335 150)">
      <rect width="255" height="365" rx="20" fill="#fff4e5" stroke="#dfa84e" stroke-width="2"/>
      <text x="127" y="39" text-anchor="middle" font-size="20" font-weight="700" fill="#684c1e">② Token 分类</text>
      <g transform="translate(24 80)" font-size="12" fill="#684c1e">
        <g><rect width="48" height="38" rx="7" fill="#f4dfb9"/><text x="24" y="24" text-anchor="middle">李</text><rect x="52" width="48" height="38" rx="7" fill="#f4dfb9"/><text x="76" y="24" text-anchor="middle">明</text><rect x="104" width="48" height="38" rx="7" fill="#f4dfb9"/><text x="128" y="24" text-anchor="middle">在</text><rect x="156" width="48" height="38" rx="7" fill="#f4dfb9"/><text x="180" y="24" text-anchor="middle">北京</text></g>
        <path d="M24 47v37M76 47v37M128 47v37M180 47v37" stroke="#dfa84e" stroke-width="2"/>
        <g transform="translate(0 88)"><rect width="48" height="38" rx="7" fill="#f4dfb9"/><text x="24" y="24" text-anchor="middle">B-PER</text><rect x="52" width="48" height="38" rx="7" fill="#f4dfb9"/><text x="76" y="24" text-anchor="middle">I-PER</text><rect x="104" width="48" height="38" rx="7" fill="#f4dfb9"/><text x="128" y="24" text-anchor="middle">O</text><rect x="156" width="48" height="38" rx="7" fill="#f4dfb9"/><text x="180" y="24" text-anchor="middle">B-LOC</text></g>
      </g>
      <text x="127" y="251" text-anchor="middle" font-size="12" fill="#745f43">Linear 作用到每个 H[:,t,:]</text><text x="127" y="273" text-anchor="middle" font-size="12" fill="#745f43">输出 [B,T,C]</text>
      <rect x="25" y="319" width="205" height="27" rx="7" fill="#f4dfb9"/><text x="127" y="338" text-anchor="middle" font-size="12" fill="#684c1e">NER / 词性 / 序列标注</text>
    </g>
    <g transform="translate(615 150)">
      <rect width="255" height="365" rx="20" fill="#eaf8f4" stroke="#72baa7" stroke-width="2"/>
      <text x="127" y="39" text-anchor="middle" font-size="20" font-weight="700" fill="#205c50">③ 抽取式问答</text>
      <text x="127" y="70" text-anchor="middle" font-size="12" fill="#4c6f67">问题 [SEP] 证据段落</text>
      <g transform="translate(26 103)" font-size="12" fill="#205c50"><rect width="203" height="42" rx="8" fill="#d5eee8"/><text x="101" y="26" text-anchor="middle">每位置两个 logit</text><path d="M101 50v34" stroke="#419b83" stroke-width="3"/><path d="M94 76l7 10 7-10" fill="none" stroke="#419b83" stroke-width="3"/><rect y="91" width="203" height="42" rx="8" fill="#d5eee8"/><text x="101" y="117" text-anchor="middle">start scores [B,T]</text><rect y="143" width="203" height="42" rx="8" fill="#d5eee8"/><text x="101" y="169" text-anchor="middle">end scores [B,T]</text></g>
      <text x="127" y="309" text-anchor="middle" font-size="12" fill="#4c6f67">答案必须是原文中的连续 span</text>
      <rect x="25" y="319" width="205" height="27" rx="7" fill="#d5eee8"/><text x="127" y="338" text-anchor="middle" font-size="12" fill="#205c50">SQuAD 风格阅读理解</text>
    </g>
    <g transform="translate(895 150)">
      <rect width="250" height="365" rx="20" fill="#f3efff" stroke="#a28de1" stroke-width="2"/>
      <text x="125" y="39" text-anchor="middle" font-size="20" font-weight="700" fill="#44336d">④ 句对 Cross-Encoder</text>
      <g transform="translate(24 82)" font-size="12" fill="#44336d"><rect width="202" height="48" rx="8" fill="#dfd5fa"/><text x="101" y="21" text-anchor="middle">[CLS] 问题 [SEP]</text><text x="101" y="38" text-anchor="middle">文档 [SEP]</text><path d="M101 57v35" stroke="#8068c6" stroke-width="3"/><path d="M94 84l7 10 7-10" fill="none" stroke="#8068c6" stroke-width="3"/><rect y="100" width="202" height="45" rx="8" fill="#dfd5fa"/><text x="101" y="127" text-anchor="middle">所有 token 互相 Attention</text><path d="M101 153v35" stroke="#8068c6" stroke-width="3"/><path d="M94 180l7 10 7-10" fill="none" stroke="#8068c6" stroke-width="3"/><rect y="196" width="202" height="45" rx="8" fill="#dfd5fa"/><text x="101" y="223" text-anchor="middle">相关 / 蕴含 / 矛盾</text></g>
      <rect x="24" y="319" width="202" height="27" rx="7" fill="#dfd5fa"/><text x="125" y="338" text-anchor="middle" font-size="12" fill="#44336d">精细但不能预编码海量文档</text>
    </g>
  </g>
  <rect x="115" y="565" width="970" height="49" rx="14" fill="#eef1ff"/><text x="600" y="595" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#25345d">双塔检索是另一接口：问题与文档分开编码后比向量；不要和这里把两段拼在一起的 Cross-Encoder 混淆</text>
</svg>
