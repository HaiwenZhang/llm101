<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">覆盖率与选中率是两个不同关卡</title>
  <desc id="desc">生成器先决定候选集中是否存在正确答案，验证器再决定是否从候选集中选中正确答案。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#23314d" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#667085"/></marker>
    <style>.title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#15233f}.sub{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.head{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2e49}.body{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#45546d}.eq{font:600 18px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#25324a}.tiny{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}</style>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#fffaf5"/>
  <text x="54" y="58" class="title">候选越多，只先提高“覆盖”；最终还要“选中”</text>
  <text x="54" y="88" class="sub">Best-of-N 的失败，常发生在第二道门。</text>

  <g filter="url(#shadow)"><rect x="54" y="132" width="410" height="310" rx="22" fill="#fff" stroke="#d8dfeb"/></g>
  <text x="82" y="176" class="head">第 1 关：候选集里有没有正确答案？</text>
  <text x="82" y="208" class="eq">Coverage(N) = 1 - (1-p)ᴺ</text>
  <g>
    <rect x="82" y="246" width="92" height="64" rx="14" fill="#f2f4f8" stroke="#c9d0dc"/><text x="128" y="284" text-anchor="middle" class="body">候选 A</text>
    <rect x="188" y="246" width="92" height="64" rx="14" fill="#e8f7f1" stroke="#249b7e" stroke-width="3"/><text x="234" y="284" text-anchor="middle" class="body">正确 ✓</text>
    <rect x="294" y="246" width="92" height="64" rx="14" fill="#f2f4f8" stroke="#c9d0dc"/><text x="340" y="284" text-anchor="middle" class="body">候选 C</text>
    <circle cx="412" cy="278" r="7" fill="#a9b2c2"/><circle cx="435" cy="278" r="7" fill="#a9b2c2"/>
  </g>
  <text x="82" y="350" class="body">若每条独立正确率 p=10%，N=16：</text>
  <text x="82" y="386" class="eq">覆盖率约 81.5%</text>
  <text x="82" y="414" class="tiny">注意：候选相关时，真实覆盖率会更低。</text>

  <path d="M478 286H598" stroke="#667085" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="487" y="238" width="102" height="34" rx="17" fill="#eef2f8"/><text x="538" y="261" text-anchor="middle" class="tiny">交给验证器</text>

  <g filter="url(#shadow)"><rect x="614" y="132" width="532" height="310" rx="22" fill="#fff" stroke="#d8dfeb"/></g>
  <text x="642" y="176" class="head">第 2 关：验证器能不能选中它？</text>
  <text x="642" y="208" class="eq">Accuracy = Coverage × Selector recall</text>
  <rect x="642" y="246" width="130" height="64" rx="14" fill="#f2f4f8" stroke="#c9d0dc"/><text x="707" y="284" text-anchor="middle" class="body">高分错误</text>
  <rect x="788" y="246" width="130" height="64" rx="14" fill="#e8f7f1" stroke="#249b7e" stroke-width="3"/><text x="853" y="284" text-anchor="middle" class="body">正确 ✓</text>
  <rect x="934" y="246" width="130" height="64" rx="14" fill="#fff0e8" stroke="#df7540" stroke-width="3"/><text x="999" y="276" text-anchor="middle" class="body">漏洞候选</text><text x="999" y="298" text-anchor="middle" class="tiny">代理分最高</text>
  <path d="M999 318V351" stroke="#c64d56" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="642" y="386" class="body">若覆盖率 81.5%，选中召回率只有 70%：</text>
  <text x="642" y="421" class="eq">最终正确率约 57.0%，不是 81.5%</text>

  <rect x="54" y="474" width="1092" height="52" rx="16" fill="#eef2f8"/>
  <text x="82" y="506" class="body">诊断顺序：先看 pass@N / oracle coverage，再看验证器的排序、校准与分布外稳健性。</text>
</svg>
