<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">GAE 中 lambda 控制的偏差方差谱</title><desc id="desc">lambda 从零到一时，优势估计从一步 TD 逐渐接近蒙特卡洛回报，Critic 依赖降低而采样方差增加。</desc>
  <rect width="1200" height="520" rx="30" fill="#f8faff"/>
  <text x="60" y="68" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#182342">λ 不是“越大越准”，而是选择相信 Critic 还是相信完整轨迹</text>
  <text x="60" y="102" font-family="system-ui,sans-serif" font-size="17" fill="#5c6787">同一个 λ 在短任务、长推理和不同质量 Critic 上，最佳折中会不同</text>
  <defs><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5368d9"/><stop offset="1" stop-color="#28987d"/></linearGradient></defs>
  <rect x="105" y="220" width="990" height="42" rx="21" fill="url(#bar)"/>
  <line x1="105" y1="203" x2="105" y2="280" stroke="#34467e" stroke-width="3"/><line x1="600" y1="203" x2="600" y2="280" stroke="#fff" stroke-width="3"/><line x1="1095" y1="203" x2="1095" y2="280" stroke="#205c50" stroke-width="3"/>
  <g font-family="system-ui,sans-serif"><text x="105" y="187" text-anchor="middle" font-size="20" font-weight="700" fill="#25345d">λ = 0</text><text x="600" y="187" text-anchor="middle" font-size="20" font-weight="700" fill="#4c5c78">折中</text><text x="1095" y="187" text-anchor="middle" font-size="20" font-weight="700" fill="#205c50">λ = 1</text>
  <text x="105" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#25345d">一步 TD</text><text x="105" y="350" text-anchor="middle" font-size="15" fill="#596683">更多 bootstrap</text><text x="105" y="376" text-anchor="middle" font-size="15" fill="#596683">低方差 · 高偏差</text>
  <text x="1095" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#205c50">Monte Carlo</text><text x="1095" y="350" text-anchor="middle" font-size="15" fill="#4c6f67">更依赖完整轨迹</text><text x="1095" y="376" text-anchor="middle" font-size="15" fill="#4c6f67">高方差 · 低 bootstrap 偏差</text>
  <rect x="365" y="414" width="470" height="58" rx="16" fill="#fff4e5"/><text x="600" y="449" text-anchor="middle" font-size="16" fill="#684c1e">γλ 决定远处 TD 误差衰减速度；episode 结束时必须截断。</text></g>
</svg>
