<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Causal mask 与 Padding mask 的区别</title>
  <desc id="desc">Causal mask 对每个查询位置屏蔽未来的键；Padding mask 对所有查询位置屏蔽补齐用的 PAD 键；二者相加到分数矩阵后再做逐行 Softmax。</desc>
  <rect width="1200" height="620" rx="30" fill="#f8faff"/>
  <text x="60" y="66" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#182342">Mask 先决定“能不能看”，Softmax 再决定“看多少”</text>
  <text x="60" y="102" font-family="system-ui,sans-serif" font-size="17" fill="#5c6787">行是 Query，列是 Key；蓝色允许，灰色在 Softmax 前加 −∞</text>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(90 166)">
      <text x="190" y="0" text-anchor="middle" font-size="21" font-weight="700" fill="#25345d">Causal mask：每行不能看未来</text>
      <g transform="translate(70 35)">
        <g fill="#dfe4fa" stroke="#fff" stroke-width="4"><rect width="62" height="62"/><rect y="62" width="62" height="62"/><rect x="62" y="62" width="62" height="62"/><rect y="124" width="62" height="62"/><rect x="62" y="124" width="62" height="62"/><rect x="124" y="124" width="62" height="62"/><rect y="186" width="62" height="62"/><rect x="62" y="186" width="62" height="62"/><rect x="124" y="186" width="62" height="62"/><rect x="186" y="186" width="62" height="62"/></g>
        <g fill="#e1e4eb" stroke="#fff" stroke-width="4"><rect x="62" width="62" height="62"/><rect x="124" width="62" height="62"/><rect x="186" width="62" height="62"/><rect x="124" y="62" width="62" height="62"/><rect x="186" y="62" width="62" height="62"/><rect x="186" y="124" width="62" height="62"/></g>
        <g font-size="20" text-anchor="middle" fill="#34467e"><text x="31" y="39">✓</text><text x="31" y="101">✓</text><text x="93" y="101">✓</text><text x="31" y="163">✓</text><text x="93" y="163">✓</text><text x="155" y="163">✓</text><text x="31" y="225">✓</text><text x="93" y="225">✓</text><text x="155" y="225">✓</text><text x="217" y="225">✓</text></g>
        <g font-size="18" text-anchor="middle" fill="#858b99"><text x="93" y="39">−∞</text><text x="155" y="39">−∞</text><text x="217" y="39">−∞</text><text x="155" y="101">−∞</text><text x="217" y="101">−∞</text><text x="217" y="163">−∞</text></g>
      </g>
      <text x="190" y="340" text-anchor="middle" font-size="15" fill="#596683">用于 Decoder / Causal LM，形成下三角</text>
    </g>
    <g transform="translate(645 166)">
      <text x="190" y="0" text-anchor="middle" font-size="21" font-weight="700" fill="#205c50">Padding mask：所有行都屏蔽 PAD 列</text>
      <g transform="translate(70 35)">
        <g fill="#d5eee8" stroke="#fff" stroke-width="4"><rect width="62" height="62"/><rect x="62" width="62" height="62"/><rect x="124" width="62" height="62"/><rect y="62" width="62" height="62"/><rect x="62" y="62" width="62" height="62"/><rect x="124" y="62" width="62" height="62"/><rect y="124" width="62" height="62"/><rect x="62" y="124" width="62" height="62"/><rect x="124" y="124" width="62" height="62"/><rect y="186" width="62" height="62"/><rect x="62" y="186" width="62" height="62"/><rect x="124" y="186" width="62" height="62"/></g>
        <g fill="#e1e4eb" stroke="#fff" stroke-width="4"><rect x="186" width="62" height="62"/><rect x="186" y="62" width="62" height="62"/><rect x="186" y="124" width="62" height="62"/><rect x="186" y="186" width="62" height="62"/></g>
        <g font-size="20" text-anchor="middle" fill="#205c50"><text x="31" y="39">✓</text><text x="93" y="39">✓</text><text x="155" y="39">✓</text><text x="31" y="101">✓</text><text x="93" y="101">✓</text><text x="155" y="101">✓</text><text x="31" y="163">✓</text><text x="93" y="163">✓</text><text x="155" y="163">✓</text><text x="31" y="225">✓</text><text x="93" y="225">✓</text><text x="155" y="225">✓</text></g>
        <g font-size="18" text-anchor="middle" fill="#858b99"><text x="217" y="39">−∞</text><text x="217" y="101">−∞</text><text x="217" y="163">−∞</text><text x="217" y="225">−∞</text></g>
      </g>
      <text x="190" y="340" text-anchor="middle" font-size="15" fill="#4c6f67">用于 batch 补齐；PAD 位置不是语义内容</text>
    </g>
  </g>
  <rect x="150" y="530" width="900" height="58" rx="15" fill="#eef1ff"/>
  <text x="600" y="557" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#25345d">实际分数 = QKᵀ / √dₖ + causal mask + padding mask</text>
  <text x="600" y="579" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#596683">再对每一行做 Softmax；若一整行全是 −∞，会产生 NaN，必须保证至少一个可见位置或显式处理</text>
</svg>
